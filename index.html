<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>競馬 買い目保存ツール</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="container">

    <h1>競馬 買い目保存ツール</h1>

    <!-- レース情報 -->
    <section class="race-info">

        <div class="form-row">
            <label for="raceName">レース名</label>
            <input type="text" id="raceName" placeholder="例：2026年 神戸新聞杯">
        </div>

        <div class="form-row">
            <label for="raceDate">日付</label>
            <input type="date" id="raceDate">
        </div>

        <div class="form-row">
            <label for="raceMemo">メモ</label>
            <textarea id="raceMemo" placeholder="レースの展開予想など"></textarea>
        </div>

    </section>


    <!-- 買い目入力 -->
    <section>

        <h2>買い目</h2>

        <div class="bet-input-area">

            <div class="form-row">
                <label for="betType">券種</label>

                <select id="betType">
                    <option value="単勝">単勝</option>
                    <option value="複勝">複勝</option>
                    <option value="馬連">馬連</option>
                    <option value="馬単">馬単</option>
                    <option value="ワイド">ワイド</option>
                    <option value="3連複">3連複</option>
                    <option value="3連単">3連単</option>
                </select>
            </div>

            <div class="form-row">
                <label for="betNumbers">買い目</label>
                <input
                    type="text"
                    id="betNumbers"
                    placeholder="例：5-8"
                >
            </div>

            <div class="form-row">
                <label for="betAmount">購入金額</label>
                <div class="amount-input">
                    <input
                        type="number"
                        id="betAmount"
                        min="100"
                        step="100"
                        placeholder="100"
                    >
                    <span>円</span>
                </div>
            </div>

            <button id="addBetButton" class="add-button">
                ＋ 買い目を追加
            </button>

        </div>

    </section>


    <!-- 買い目一覧 -->
    <section>

        <h2>買い目一覧</h2>

        <div id="betList" class="bet-list">
            <p class="empty-message">買い目がありません</p>
        </div>

        <div class="total-area">
            合計購入金額：
            <span id="totalAmount">0</span> 円
        </div>

    </section>


    <!-- 保存 -->
    <section class="save-area">

        <button id="saveButton" class="save-button">
            💾 このレースを保存
        </button>

        <button id="clearButton" class="clear-button">
            入力内容をクリア
        </button>

    </section>


    <!-- 保存済みレース -->
    <section>

        <h2>保存済みレース</h2>

        <div id="savedRaceList" class="saved-race-list">
            <p class="empty-message">
                保存されているレースがありません
            </p>
        </div>

    </section>

</div>

<script src="script.js"></script>

</body>
</html>
